<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"
     font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .box   { fill: #ffffff; stroke: #d7dae0; stroke-width: 1.5; rx: 10; }
    .accent{ fill: #e8f5f1; stroke: #10a37f; stroke-width: 1.5; rx: 10; }
    .tint  { fill: #f4f5f7; stroke: #d7dae0; stroke-width: 1.5; rx: 10; }
    .t     { fill: #1f2023; font-size: 14px; }
    .tb    { fill: #1f2023; font-size: 14.5px; font-weight: 600; }
    .m     { fill: #6b6d76; font-size: 12px; }
    .lbl   { fill: #10a37f; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; }
    .arrow { stroke: #9aa0a8; stroke-width: 1.6; fill: none; }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #25262b; stroke: #3a3c44; }
      .accent{ fill: #12312a; stroke: #10a37f; }
      .tint  { fill: #1e1f24; stroke: #3a3c44; }
      .t, .tb{ fill: #ececf1; }
      .m     { fill: #9a9ca5; }
      .arrow { stroke: #6b6d76; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a8"/>
    </marker>
  </defs>

  <text x="24" y="30" class="lbl">ONE BROWSER TAB — NO SERVER, NO INSTALL</text>
  <rect x="20" y="42" width="840" height="308" class="tint"/>

  <rect x="44" y="74" width="360" height="120" class="accent"/>
  <text x="64" y="102" class="tb">your code</text>
  <text x="64" y="126" class="m">import torch  →  resolves to webtorch</text>
  <text x="64" y="148" class="m">nn / autograd / optim · AutoModelForCausalLM</text>
  <text x="64" y="170" class="m">pipeline(...) · Quantizer · OnnxModel</text>

  <rect x="440" y="74" width="376" height="120" class="box"/>
  <text x="460" y="102" class="tb">weights, streamed in</text>
  <text x="460" y="126" class="m">GGUF · HF safetensors · AutoGPTQ · ONNX</text>
  <text x="460" y="148" class="m">a hub repo id, a URL, or a file on this device</text>
  <text x="460" y="170" class="m">read by range, cached, never fully in RAM</text>

  <rect x="44" y="218" width="772" height="52" class="box"/>
  <text x="64" y="250" class="tb">Pyodide</text>
  <text x="150" y="250" class="m">CPython 3.11 compiled to WebAssembly, in a Web Worker</text>

  <rect x="44" y="286" width="772" height="46" class="box"/>
  <text x="64" y="315" class="tb">WgPy</text>
  <text x="150" y="315" class="m">array kernels, graph capture/replay, quantised matmul</text>

  <path d="M224 194 L224 218" class="arrow" marker-end="url(#a)"/>
  <path d="M628 194 L628 218" class="arrow" marker-end="url(#a)"/>
  <path d="M430 270 L430 286" class="arrow" marker-end="url(#a)"/>
  <path d="M430 332 L430 372" class="arrow" marker-end="url(#a)"/>

  <rect x="286" y="374" width="290" height="44" class="accent"/>
  <text x="311" y="402" class="tb">WebGPU</text>
  <text x="396" y="402" class="m">(WebGL fallback) — the GPU</text>
</svg>
