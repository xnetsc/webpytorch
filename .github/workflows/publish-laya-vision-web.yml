name: Publish Laya Vision browser bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "laya-vision-web-*"

permissions:
  contents: write

concurrency:
  group: laya-vision-web
  cancel-in-progress: false

env:
  UPSTREAM_COMMIT: 9db75564ad8dc119c1d9b03adad3025694219b04
  CHECKPOINT: thaitea/laya-vision
  CHECKPOINT_REVISION: 8b318c9
  RELEASE_TAG: laya-vision-web-201m-v1

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the pinned exporter
        run: |
          git clone https://github.com/r33drichards/laya-vision.git /tmp/laya-vision
          git -C /tmp/laya-vision checkout "$UPSTREAM_COMMIT"

      - name: Install export dependencies
        working-directory: /tmp/laya-vision
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 torchvision==0.29.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . transformers==5.17.0 \
            onnx==1.23.0 onnxruntime==1.30.0 onnxscript==0.7.2

      - name: Export and validate FP16 graphs
        working-directory: /tmp/laya-vision
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python scripts/export_onnx.py "$CHECKPOINT" \
            --revision "$CHECKPOINT_REVISION" \
            --out /tmp/laya-web \
            --quantize fp16 \
            --validate
          test -s /tmp/laya-web/laya_web.json
          test -s /tmp/laya-web/vision_fp16.onnx
          test -s /tmp/laya-web/text_fp16.onnx
          test -s /tmp/laya-web/head_fp16.onnx

      - name: Flatten tokenizer files for release assets
        run: |
          cp /tmp/laya-web/tokenizer/tokenizer.json /tmp/laya-web/tokenizer.json
          cp /tmp/laya-web/tokenizer/tokenizer_config.json /tmp/laya-web/tokenizer_config.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("/tmp/laya-web/laya_web.json")
          data = json.loads(path.read_text())
          data["tokenizer"] = ["tokenizer.json", "tokenizer_config.json"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            /tmp/laya-web/laya_web.json
            /tmp/laya-web/tokenizer.json
            /tmp/laya-web/tokenizer_config.json
            /tmp/laya-web/vision_fp16.onnx
            /tmp/laya-web/text_fp16.onnx
            /tmp/laya-web/head_fp16.onnx
            /tmp/laya-web/validation.json
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Laya Vision 201M browser bundle" \
              --notes "Pinned browser export of thaitea/laya-vision@8b318c9. Code: Apache-2.0. Model weights: CC BY-NC-SA 4.0. validation.json records the export parity checks."
          fi
